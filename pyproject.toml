[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-audio"
version = "1.0.0"
requires-python = ">=3.12"
keywords = [
    "ace-step",
    "ai-audio",
    "apple-silicon",
    "audio-generation",
    "diffusion",
    "gradio",
    "lora",
    "mlx",
    "music-generation",
    "pytorch",
    "stable-audio",
    "training",
]
dependencies = [
    "alias-free-torch>=0.0.6",
    "auraloss>=0.4.0",
    "descript-audio-codec==1.0.0",
    "einops>=0.6.0",
    "einops-exts>=0.0.4",
    "ema-pytorch>=0.2.3",
    "encodec>=0.1.1",
    "gradio>=3.42.0",
    "huggingface_hub>=0.19.0",
    "importlib-resources>=5.12.0",
    "k-diffusion==0.1.1",
    "laion-clap>=1.1.4",
    "local-attention>=1.8.6",
    "pandas>=2.0.0",
    "pedalboard>=0.7.4",
    "prefigure>=0.0.9",
    "pytorch_lightning>=2.1.0,<3.0.0",
    "PyWavelets>=1.4.0",
    "safetensors>=0.3.0",
    "sentencepiece>=0.1.99",
    "s3fs",
    "torch>=2.0.1",
    "torchaudio>=2.0.2",
    "torchmetrics>=0.11.4",
    "tqdm",
    "transformers>=4.35.0",
    "v-diffusion-pytorch==0.0.2",
    "vector-quantize-pytorch>=1.9.14",
    "wandb>=0.15.4",
    "webdataset>=0.2.48",
    "x-transformers<1.27.0",
]

[project.scripts]
anvil = "anvil_audio.cli:main"

[project.optional-dependencies]
mlx = [
    "mlx-audiogen",
]
intelligence = [
    "mlx-lm",
]
dataset = [
    "yt-dlp>=2024.5.27",
]
acestep = [
    "ace-step @ git+https://github.com/ace-step/ACE-Step-1.5.git",
]
apple = [
    "anvil-audio[mlx]",
    "anvil-audio[acestep]",
    "anvil-audio[intelligence]",
    "anvil-audio[dataset]",
]
cuda = [
    "anvil-audio[acestep]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
